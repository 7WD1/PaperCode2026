[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-shapleynet"
version = "0.1.0"
description = "Recovery-grounded complete-route attribution and verified mobile charging"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "pandas==2.2.2", "scipy==1.13.1", "statsmodels==0.14.2", "PyYAML==6.0.2", "tzdata==2025.2"]

[project.optional-dependencies]
learning = ["torch==2.3.1", "torch-geometric==2.5.3", "scikit-learn==1.5.2", "joblib==1.4.2"]
sumo = ["libsumo==1.22.0; sys_platform != 'win32'", "sumolib==1.22.0", "traci==1.22.0", "eclipse-sumo==1.22.0; sys_platform != 'win32'"]
milp = ["gurobipy>=11.0,<11.1"]
test = ["pytest==8.3.5"]

[project.scripts]
rc-shapleynet = "rc_shapleynet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rc_shapleynet = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
