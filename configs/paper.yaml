schema_version: 1
environment:
  python: "3.10.12"
  sumo: "1.22.0"
  torch: "2.3.1"
  cuda: "12.1"
  torch_geometric: "2.5.3"
  solver: "Gurobi 11.0"
  scipy: "1.13.1"
  statsmodels: "0.14.2"
seeds:
  training: [1, 2, 3, 4, 5]
  simulation_start: 10001
  scenarios: 100
  coalition_stream: "simulation_seed * 1000 + mask_index"
model:
  raw_recipient_fields: 13
  numerical_fields: 12
  location_embedding: 16
  dense_recipient_input: 28
  hidden_dim: 128
  layers: 2
  order: 2
sharing:
  lambda_: 0.5
  tau: 0.5
  eta: 0.5
training:
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 32
  max_epochs: 100
  patience: 10
  rank_weight: 0.5
  resource_weight: 0.5
  sparse_weight: 0.001
  rank_margin: 0.05
  rank_pool_fraction: 0.2
  states_per_domain: 1000
  plans_per_state: 4
  masks_per_plan: 16
  trajectories_per_plan: 8
search:
  max_evaluations: 200
  time_limit: 60.0
  exploration: 0.1
  min_removed: 2
  max_removed: 4
physical:
  step_seconds: 1.0
  ev_horizon_minutes: 60
  ev_replan_seconds: 60
  wrsn_horizon_minutes: 30
  wrsn_replan_seconds: 30
  ev_episode_hours: 12
  wrsn_episode_hours: 24
  energy_reference_kwh: 1000.0
  ev_wait_reference_minutes: 30.0
  ev_weights: [0.40, 0.25, 0.15, 0.10, 0.10]
  wrsn_weights: [0.40, 0.30, 0.20, 0.10]
  ev_receiver_efficiency: 0.92
data:
  ev_source: "ACN-Data Caltech"
  last_date: "2021-09-13"
  train_end_exclusive: "2020-07-01"
  validation_end_exclusive: "2021-02-01"
  split_by: "date and frozen scenario ID"
  demand_proxy: "kWhDelivered only when explicit requested energy is absent"
  wrsn_split_by: "disjoint topology, hotspot, initial-energy and scenario IDs"
