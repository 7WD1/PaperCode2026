name: Reference implementation checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.12'
          cache: pip
      - run: python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[learning,sumo,test]'
      - run: python -m pytest -q
      - run: rc-shapleynet validate examples/figure2.json
      - run: rc-shapleynet audit examples/figure2.json
      - run: rc-shapleynet statistics --list-families
